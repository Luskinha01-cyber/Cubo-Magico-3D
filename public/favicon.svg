<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Contorno Preto / Base do Cubo -->
  <g filter="url(#shadow)" stroke="#18181b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Face Superior (Amarelo) -->
    <!-- Linha 1 Topo -->
    <polygon points="32,4 40,8 32,12 24,8" fill="#facc15" />
    <polygon points="40,8 48,12 40,16 32,12" fill="#fde047" />
    <polygon points="48,12 56,16 48,20 40,16" fill="#facc15" />
    <!-- Linha 2 Topo -->
    <polygon points="24,8 32,12 24,16 16,12" fill="#fde047" />
    <polygon points="32,12 40,16 32,20 24,16" fill="#facc15" />
    <polygon points="40,16 48,20 40,24 32,20" fill="#fde047" />
    <!-- Linha 3 Topo -->
    <polygon points="16,12 24,16 16,20 8,16" fill="#facc15" />
    <polygon points="24,16 32,20 24,24 16,20" fill="#fde047" />
    <polygon points="32,20 40,24 32,28 24,24" fill="#facc15" />

    <!-- Face Esquerda (Vermelho) -->
    <!-- Coluna 1 -->
    <polygon points="8,16 16,20 16,30 8,26" fill="#ef4444" />
    <polygon points="8,26 16,30 16,40 8,36" fill="#dc2626" />
    <polygon points="8,36 16,40 16,50 8,46" fill="#ef4444" />
    <!-- Coluna 2 -->
    <polygon points="16,20 24,24 24,34 16,30" fill="#dc2626" />
    <polygon points="16,30 24,34 24,44 16,40" fill="#ef4444" />
    <polygon points="16,40 24,44 24,54 16,50" fill="#dc2626" />
    <!-- Coluna 3 -->
    <polygon points="24,24 32,28 32,38 24,34" fill="#ef4444" />
    <polygon points="24,34 32,38 32,48 24,44" fill="#dc2626" />
    <polygon points="24,44 32,48 32,58 24,54" fill="#ef4444" />

    <!-- Face Direita (Verde) -->
    <!-- Coluna 1 -->
    <polygon points="32,28 40,24 40,34 32,38" fill="#22c55e" />
    <polygon points="32,38 40,34 40,44 32,48" fill="#16a34a" />
    <polygon points="32,48 40,44 40,54 32,58" fill="#22c55e" />
    <!-- Coluna 2 -->
    <polygon points="40,24 48,20 48,30 40,34" fill="#16a34a" />
    <polygon points="40,34 48,30 48,40 40,44" fill="#22c55e" />
    <polygon points="40,44 48,40 48,50 40,54" fill="#16a34a" />
    <!-- Coluna 3 -->
    <polygon points="48,20 56,16 56,26 48,30" fill="#22c55e" />
    <polygon points="48,30 56,26 56,36 48,40" fill="#16a34a" />
    <polygon points="48,40 56,36 56,46 48,50" fill="#22c55e" />
  </g>
</svg>
